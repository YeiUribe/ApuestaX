name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1

        env:
          VITE_API_URL: "https://apuestax-api-tdea-byb6b4e5h6btb8dd.brazilsouth-01.azurewebsites.net/  pi"

          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: "apuestax-pagos.firebaseapp.com"  
          VITE_FIREBASE_PROJECT_ID: "apuesta  x-pagos"
          VITE_FIREBASE_STORAGE_BUCKET: "apuestax-pagos.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "13986195  5830"
          VITE_FIREBASE_APP_ID: $ {{secrets.VITE_FIREBASE_APP_ID}}

        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_BAY_02999371E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"

          # Frontend React + Vite
          app_location: "./frontend"

          # El backend está desplegado aparte en Azure App Service
          api_location: ""

          # Vite genera la aplicación compilada en dist/
          output_location: "dist"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1

        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_BAY_02999371E }}
          action: "close"
